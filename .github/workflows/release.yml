name: Release

# Builds the companion APK and release-mode installers for Windows, macOS and Linux.
#   - push a tag like v0.1.0   -> builds everything and publishes a GitHub Release
#   - run manually (Actions tab) -> builds everything and uploads the installers as artifacts only
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      # Stable signing key so upgrades install over older versions. Secrets: ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Skipped (debug key) if unset,
      # e.g. on forks; tagged releases require it.
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RD_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required to publish a release"; exit 1
          else
            echo "::warning::No release keystore; signing with the debug key"
          fi

      - name: Build Android Application
        working-directory: android
        env:
          RD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk remote-display.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: remote-display.apk
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: android
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, formats: nsis }
          - { name: macos-arm64, os: macos-latest, formats: app }
          - { name: linux-x64, os: ubuntu-22.04, formats: "deb,appimage" }
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          pkg=$(grep -m1 '^version' Packager.toml | sed 's/.*"\(.*\)"/\1/')
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag Cargo.toml=$crate Packager.toml=$pkg"
          [ "$tag" = "$crate" ] && [ "$tag" = "$pkg" ] || { echo "::error::tag, Cargo.toml and Packager.toml versions must match"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake libasound2-dev libfontconfig-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libssl-dev libzstd-dev file desktop-file-utils squashfs-tools xz-utils

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: assets
      - name: Install cargo-packager
        uses: actions/cache@v4
        id: packager-cache
        with:
          path: ~/.cargo/bin/cargo-packager${{ runner.os == 'Windows' && '.exe' || '' }}
          key: cargo-packager-0.11.8-${{ runner.os }}
      - if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked --release

      - name: Build (release)
        run: cargo build --release --locked -p rd-desktop

      - name: Package
        run: cargo packager --release --formats ${{ matrix.formats }} -c Packager.toml

      - name: macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          apk="dist/Remote Display.app/Contents/Resources/remote-display.apk"
          [ -f "$apk" ] && cmp "$apk" assets/remote-display.apk \
            || { echo "::error::APK missing or different in the .app bundle"; exit 1; }
          chmod +x ./packaging/make-dmg.sh
          version=$(grep -m1 '^version' Packager.toml | sed 's/.*"\(.*\)"/\1/')
          ./packaging/make-dmg.sh "dist/Remote Display.app" "dist/remote-display_${version}_aarch64.dmg"
          rm -rf "dist/Remote Display.app" dist/.cargo-packager

      - name: List installers
        shell: bash
        run: ls -la dist

      - name: Verify APK is inside the installer
        shell: bash
        run: |
          set -euo pipefail
          size=$(wc -c < assets/remote-display.apk | tr -d ' ')
          echo "source APK: $size bytes"
          case "$RUNNER_OS" in
            Linux)
              deb=$(ls dist/*.deb)
              dpkg-deb -c "$deb" | tee /dev/stderr | grep -q 'remote-display\.apk' \
                || { echo "::error::APK missing from $deb"; exit 1; }
              img=$(ls dist/*.AppImage)
              chmod +x "$img"
              (cd "$RUNNER_TEMP" && rm -rf squashfs-root && "$OLDPWD/$img" --appimage-extract >/dev/null)
              find "$RUNNER_TEMP/squashfs-root" -name remote-display.apk | tee /dev/stderr | grep -q . \
                || { echo "::error::APK missing from AppImage"; exit 1; }
              ;;
            macOS)
              # Checked on the .app in the "macOS disk image" step, before it is removed.
              ls dist/*.dmg ;;
            Windows)
              exe=$(ls dist/*.exe)
              7z l "$exe" | tee /dev/stderr | grep -q 'remote-display\.apk' \
                || { echo "::error::APK missing from $exe"; exit 1; }
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    needs: [android, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
