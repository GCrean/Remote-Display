# Installer configuration for `cargo packager` (https://github.com/crabnebula-dev/cargo-packager).
# Usage (after `cargo build --release -p rd-desktop`):
#   cargo packager --release --formats nsis   # Windows installer
#   cargo packager --release --formats dmg    # macOS disk image (+ .app)
#   cargo packager --release --formats deb,appimage   # Linux
name = "remote-display"
product-name = "Remote Display"
version = "0.2.0"
identifier = "dev.remote.display.desktop"
description = "Mirror and control an Android device from your desktop"
long-description = "Mirror an Android device's screen and audio to your desktop, control it with mouse and keyboard, record sessions to MP4, and drive it from MCP clients."
authors = ["Remote Display contributors"]
publisher = "Thunderlight Software"
license-file = "LICENSE"
category = "Utility"
out-dir = "dist"
binaries-dir = "target/release"
icons = ["desktop/icons/32x32.png", "desktop/icons/128x128.png", "desktop/icons/256x256.png", "desktop/icons/512x512.png", "desktop/icons/icon.icns", "desktop/icons/icon.ico"]
binaries = [{ path = "remote-display", main = true }]
# The companion Android app, installed on the phone by the desktop app on first connect.
resources = [{ src = "assets/remote-display.apk", target = "remote-display.apk" }]

[nsis]
installer-icon = "desktop/icons/icon.ico"
installer-mode = "currentUser"

[dmg]
window-size = { width = 540, height = 380 }
app-position = { x = 140, y = 190 }
application-folder-position = { x = 400, y = 190 }

[deb]
depends = ["libasound2t64 | libasound2", "libxkbcommon-x11-0", "libvulkan1", "adb | android-tools-adb"]
section = "utils"
